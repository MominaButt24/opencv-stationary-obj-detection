[project]
name = "opencv-stationary-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mominabutt24", email = "bmomina752@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.202",
]

[project.scripts]
opencv-stationary-detection = "opencv_stationary_detection:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
